	<body>
		<div id="logo" onclick="goTo('about')"></div>

			</div>

			</div>
		</div>
		<div id="header">
			<h1>American Type Revival</h1>
			<div id="filters" class="has-dropdowns">
				<p>Displaying&nbsp;</p>
				<div class="dropdown">
					<div class="dropbtn" id="displaying">all fonts</div>
					<div class="dropdown-content">
						<a onclick="display(0)">all fonts</a>
						<a onclick="display(1)">free fonts</a>
					</div>
				</div>
				<p>, sorted&nbsp;</p>
				<div class="dropdown">
					<div class="dropbtn" id="sorting">alphabetically</div>
					<div class="dropdown-content">
						<a onclick="sort(0)">alphabetically</a>
						<a onclick="sort(1)">by date</a>
						<a onclick="sort(2)">by popularity</a>
					</div>
				</div>
				<p>, and&nbsp;</p>
				<div class="dropdown">
					<div class="dropbtn" id="grouping">grouped by family</div>
					<div class="dropdown-content">
						<a onclick="group(true)">grouped by family</a>
						<a onclick="group(false)">displaying&nbsp;all&nbsp;styles</a>
					</div>
				</div>
				<p>.</p>
			</div>
		</div>
